<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕐 Global Time Clock</h1>
            <p class="subtitle">Current time across different time zones</p>
        </header>

        <div class="controls">
            <div class="format-toggle">
                <label for="timeFormat">Time Format:</label>
                <select id="timeFormat">
                    <option value="12">12-Hour</option>
                    <option value="24">24-Hour</option>
                </select>
            </div>
            <div class="timezone-add">
                <label for="timezoneSelect">Add Timezone:</label>
                <select id="timezoneSelect">
                    <option value="">Select a timezone...</option>
                </select>
                <button id="addBtn">Add</button>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be dynamically inserted here -->
        </div>
    </div>

    <script src="timezones.js"></script>
    <script src="script.js"></script>
</body>
</html>
